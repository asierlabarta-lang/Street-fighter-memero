<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Fighter Memero</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--c:#2de2e6;--m:#ff3b8d;--y:#ffd23f}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0c0a1d;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{position:relative;max-width:720px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#app.L{max-width:none;flex-direction:row;align-items:stretch}
body.rot #app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;max-width:none;margin:0;transform-origin:0 0;transform:rotate(90deg)}
.cw{position:relative;flex:0 0 auto}
.L .cw{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;order:1}
canvas{display:block;width:100%;aspect-ratio:8/5;background:#1b1030}
.L canvas{width:100%;height:100%;object-fit:contain;aspect-ratio:auto;background:#1b1030}
.mn{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:2px solid #fff4;background:#0008;color:#fff;font-size:16px;z-index:2}
.ctl{flex:1;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
.L .ctl{display:contents}
.grp{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.L .grp{grid-template-columns:repeat(3,50px);gap:6px;align-self:center;padding:6px}
.L .gm{order:0}.L .ga{order:2}
.grp button{height:64px;border-radius:50%;border:3px solid #fff4;background:#2a1750;color:#fff;font:700 22px Bungee,Impact;touch-action:none}
.grp button.on{background:#ffd23f;color:#1b1030}
.grp .ab{font-size:10px;line-height:1.1;background:#7a1330;padding:0}
.L .grp button{height:50px;font-size:17px}.L .grp .ab{font-size:8px}
@media (max-width:420px){.grp{grid-template-columns:repeat(3,54px)}.grp button{height:54px;font-size:18px}}
.scr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 15% 0,#33187a,transparent 55%),radial-gradient(circle at 95% 100%,#6a1048,transparent 50%),#0c0a1d}
.scr::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,#ffffff06 26px 52px);pointer-events:none}
.scr.off{display:none}
.scr>*{position:relative}
.menu{align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.logo{margin:0;font-family:Bungee,Impact,sans-serif;line-height:.95;font-weight:400}
.logo small{display:block;font-size:clamp(16px,4.6vw,26px);letter-spacing:.12em;color:#fff}
.logo b{display:block;font-weight:400;font-size:clamp(44px,15vw,92px);background:linear-gradient(90deg,var(--c),var(--m));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0008)}
.btn{font:400 20px Bungee,Impact,sans-serif;background:linear-gradient(90deg,var(--c),var(--m));color:#0c0a1d;border:0;border-radius:14px;padding:14px 44px;cursor:pointer;box-shadow:0 6px 24px #ff3b8d55}
.btn:active{transform:translateY(2px)}
.btn2{font:600 14px system-ui,sans-serif;background:#ffffff12;color:#fff;border:1px solid #ffffff33;border-radius:12px;padding:10px 18px;cursor:pointer}
.btn:focus-visible,.btn2:focus-visible,.card:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.pulse{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 6px 36px #2de2e688;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hint{font-size:12px;line-height:1.5;opacity:.7;max-width:340px;margin:0}
.strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:360px}
.strip i{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #ffffff44;background:#2a1750}
.strip img{width:100%;height:100%;object-fit:cover;object-position:top}
.sel{padding:10px 12px;gap:10px}
.sh{display:flex;align-items:center;gap:10px}
.sh h2{margin:0;font:400 clamp(16px,4.5vw,22px) Bungee,Impact,sans-serif}
.selbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.prev{flex:0 0 auto;height:30%;min-height:120px;display:flex;align-items:flex-end;gap:12px;background:#ffffff0f;border:1px solid #ffffff22;border-radius:16px;padding:10px}
.prev img{height:100%;max-width:42%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 16px #2de2e688)}
.inf{flex:1;align-self:center}
.inf h3{margin:0 0 6px;font:400 clamp(15px,4.2vw,22px) Bungee,Impact,sans-serif}
.chip{display:inline-block;background:#ffffff1c;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin:3px 4px 0 0}
.grid{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;align-content:start;padding:2px}
.card{background:#ffffff12;border:2px solid #ffffff22;border-radius:14px;padding:6px;cursor:pointer;color:#fff;font:700 10px/1.15 system-ui,sans-serif;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.card img{width:100%;height:74px;object-fit:contain;object-position:top}
.rnd{height:74px;display:flex;align-items:center;font-size:34px}
.card.on{border-color:var(--c);background:#2de2e62a;box-shadow:0 0 18px #2de2e66a}
.L .selbody{flex-direction:row}
.L .prev{width:36%;height:auto;flex-direction:column;align-items:center;text-align:center}
.L .prev img{height:58%;max-width:100%}
.L .inf{flex:0}
.L .sel .btn{padding:8px 30px;font-size:17px}
</style></head><body><div id="app">
<div class="cw"><canvas id="c" width="640" height="400"></canvas><button class="mn" id="bMn" aria-label="Menú">☰</button></div>
<div class="ctl">
<div class="grp gm"><span></span><button data-k="j" aria-label="Saltar">▲</button><span></span><button data-k="l" aria-label="Izquierda">◀</button><span></span><button data-k="r" aria-label="Derecha">▶</button></div>
<div class="grp ga"><button class="ab" data-k="s">ATAQUE</button><button class="ab" data-k="d">ESPECIAL</button><button class="ab" data-k="p">GOLPE</button></div>
</div>
<div class="scr menu" id="scrMenu"><h1 class="logo"><small>STREET FIGHTER</small><b>MEMERO</b></h1><div class="strip" id="strip"></div>
<button class="btn pulse" id="bPlay">JUGAR</button>
<div class="row2"><button class="btn2" id="bMode">Pantalla: automática</button><button class="btn2" id="bFs">Pantalla completa</button></div>
<p class="hint">Gana 2 rounds. El especial se carga al pelear (barra azul).<br>Teclado: ← → mover, ↑ saltar, J golpe, K ataque, L especial.</p></div>
<div class="scr sel off" id="scrSel"><div class="sh"><button class="btn2" id="bBack">← Menú</button><h2>Elige tu luchador</h2></div>
<div class="selbody"><div class="prev"><img id="pimg" alt=""><div class="inf"><h3 id="pnm"></h3><div id="pch"></div></div></div><div class="grid" id="grid"></div></div>
<button class="btn" id="bGo">¡PELEAR!</button></div>
<div class="scr menu off" id="scrEnd"><h1 class="logo"><b id="et" style="font-size:clamp(30px,10vw,60px)"></b></h1><p class="hint" id="ep"></p><div class="row2"><button class="btn" id="bRe">REVANCHA</button><button class="btn2" id="bEl">Elegir otro</button><button class="btn2" id="bMe">Menú</button></div></div>
</div>
